# ══════════════════════════════════════════════════════════════════════════════
# ChessGod WAP — Unity Android Build Pipeline  (game-ci v4)
#
# REQUIRED GITHUB SECRETS (set these before triggering a build):
#   UNITY_LICENSE      — Full contents of Unity_lic.ulf (see activate.yml)
#   UNITY_EMAIL        — Your Unity account email
#   UNITY_PASSWORD     — Your Unity account password
#   ANDROID_KEYSTORE_BASE64  — Base64-encoded .jks keystore file
#   ANDROID_KEY_ALIAS        — Key alias
#   ANDROID_KEY_PASS         — Key password
#   ANDROID_STORE_PASS       — Keystore password
#
# HOW TO GENERATE A KEYSTORE (run once on any machine with Java):
#   keytool -genkey -v -keystore chessgod.jks -alias ChessGod \
#           -keyalg RSA -keysize 2048 -validity 10000
#   # Encode to base64 (PowerShell):
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("chessgod.jks"))
# ══════════════════════════════════════════════════════════════════════════════

name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

env:
  UNITY_VERSION: 2022.3.62f1
  STOCKFISH_URL: https://github.com/official-stockfish/Stockfish/releases/download/sf_17.1/stockfish-android-armv8.tar

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1: Download Stockfish binary (done outside Unity to keep build fast)
  # ─────────────────────────────────────────────────────────────────────────
  prepare-assets:
    name: Download Stockfish ARM64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and extract Stockfish ARM64
        run: |
          mkdir -p Assets/Plugins/Android
          curl -fsSL "${{ env.STOCKFISH_URL }}" -o stockfish.tar
          tar -xf stockfish.tar
          # Find the binary (name varies by release)
          SF_BIN=$(find . -type f \( -name "stockfish" -o -name "stockfish-*" \) \
                    ! -name "*.tar" ! -name "*.zip" | head -1)
          echo "Found binary: $SF_BIN"
          cp "$SF_BIN" Assets/Plugins/Android/stockfish
          chmod +x Assets/Plugins/Android/stockfish
          echo "✅ Stockfish binary ready"
          ls -lh Assets/Plugins/Android/stockfish

      - name: Upload Stockfish binary
        uses: actions/upload-artifact@v4
        with:
          name: stockfish-binary
          path: Assets/Plugins/Android/stockfish
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2: Build Unity Android APK
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: prepare-assets
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download Stockfish binary
        uses: actions/download-artifact@v4
        with:
          name: stockfish-binary
          path: Assets/Plugins/Android

      - name: Fix Stockfish permissions
        run: chmod +x Assets/Plugins/Android/stockfish

      - name: Cache Unity Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      # game-ci unity-builder@v4 handles license activation internally.
      # No separate activate step needed for Personal license.
      - name: Free up disk space (optional, gives more room for swap)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Add Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform:        Android
          unityVersion:          ${{ env.UNITY_VERSION }}
          buildName:             ChessGodWAP
          buildsPath:            build
          buildMethod:           UnityBuilderAction.BuildScript.Build
          androidExportType:     androidPackage
          allowDirtyBuild:       true
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass:   ${{ secrets.ANDROID_STORE_PASS }}
          androidKeyaliasName:   ${{ secrets.ANDROID_KEY_ALIAS }}
          androidKeyaliasPass:   ${{ secrets.ANDROID_KEY_PASS }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ChessGodWAP-${{ github.run_number }}
          path: build/Android/*.apk
          retention-days: 30

      - name: Extract and Push Build Log on Failure
        if: failure()
        run: |
          mkdir -p debug
          cp -f $(find / -name Editor.log -o -name build.log 2>/dev/null | grep unity3d | head -1) debug/Editor.log || true
          
      - name: Upload Debug Log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Unity-Build-Log
          path: debug/Editor.log

      - name: Print build summary
        if: success()
        run: |
          echo "══════════════════════════════════════════════"
          echo "  ✅ BUILD SUCCEEDED"
          echo "  Download APK from the Actions Artifacts tab"
          echo "══════════════════════════════════════════════"
          ls -lh build/Android/*.apk 2>/dev/null || echo "(APK not found in expected path)"
